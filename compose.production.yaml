name: family-dent

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - public
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      DB_POOL_MAXIMUM_SIZE: ${DB_POOL_MAXIMUM_SIZE:-10}
      DB_POOL_MINIMUM_IDLE: ${DB_POOL_MINIMUM_IDLE:-2}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME in .env.production}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:?Set BOOTSTRAP_ADMIN_FIRST_NAME in .env.production}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:?Set BOOTSTRAP_ADMIN_LAST_NAME in .env.production}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-45m}
      LOGIN_MAXIMUM_FAILURES: ${LOGIN_MAXIMUM_FAILURES:-5}
      LOGIN_MAXIMUM_FAILURES_PER_IP: ${LOGIN_MAXIMUM_FAILURES_PER_IP:-20}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      LOGIN_BLOCK_MINUTES: ${LOGIN_BLOCK_MINUTES:-15}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      BOOKING_MAXIMUM_REQUESTS_PER_IP_PER_HOUR: ${BOOKING_MAXIMUM_REQUESTS_PER_IP_PER_HOUR:-10}
    secrets:
      - source: db_password
        target: DB_PASSWORD
      - source: bootstrap_admin_password
        target: BOOTSTRAP_ADMIN_PASSWORD
      - source: fingerprint_secret
        target: FINGERPRINT_SECRET
    expose:
      - "8080"
    networks:
      - public
      - database
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    secrets:
      - db_password
    volumes:
      - ./deployment/scripts:/scripts:ro
      - type: bind
        source: ${BACKUP_HOST_PATH:?Set BACKUP_HOST_PATH in .env.production}
        target: /backups
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "loop"]
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  restore:
    image: postgres:17-alpine
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
    secrets:
      - db_password
    volumes:
      - ./deployment/scripts:/scripts:ro
      - type: bind
        source: ${BACKUP_HOST_PATH:?Set BACKUP_HOST_PATH in .env.production}
        target: /backups
        read_only: true
    entrypoint: ["/bin/sh", "/scripts/restore.sh"]
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

secrets:
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password.txt
  bootstrap_admin_password:
    file: ${SECRETS_DIR:-./secrets}/bootstrap_admin_password.txt
  fingerprint_secret:
    file: ${SECRETS_DIR:-./secrets}/fingerprint_secret.txt

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  public:
  database:
    internal: true
