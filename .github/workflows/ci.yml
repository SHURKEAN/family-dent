name: Build and security checks

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_test -d dental_clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_TESTS: "true"
      TEST_DB_URL: jdbc:postgresql://localhost:5432/dental_clinic_test
      TEST_DB_USERNAME: dental_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit, security, and PostgreSQL migration tests
        run: ./mvnw --batch-mode verify
      - name: Build production container
        run: docker build --tag family-dent:test .
