spring:
  datasource:
    url: jdbc:h2:mem:dental_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

clinic:
  bootstrap-admin:
    enabled: false
  security:
    fingerprint-secret: family-dent-test-fingerprint-secret-32-characters
