<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Şifreyi sıfırla', ~{::main})}">
<main>
    <div class="page-heading"><p class="eyebrow mb-1">Yönetim</p><h1>Şifreyi sıfırla</h1>
        <p class="text-secondary mb-0"><span th:text="${user.fullName}">çalışan</span> için yeni bir şifre belirleyin.</p>
    </div>
    <section class="content-card form-card">
        <form th:object="${passwordForm}" th:action="@{/admin/users/{id}/password(id=${user.id})}" method="post" class="p-4">
            <div class="mb-3">
                <label for="password" class="form-label">Yeni şifre *</label>
                <input id="password" type="password" class="form-control" th:field="*{password}" autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{password}"></div>
                <div class="form-text">8–72 karakter kullanın. Şifreyi çalışanla güvenli bir kanaldan paylaşın.</div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Şifreyi sıfırla</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/users}">İptal</a>
            </div>
        </form>
    </section>
</main>
</html>
