<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Randevu Talepleri', ~{::main})}">
<main>
    <div class="page-heading d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div><p class="eyebrow mb-1">Online başvurular</p><h1>Randevu talepleri</h1><p class="text-secondary mb-0">Hastalardan gelen talepleri onaylayın veya reddedin.</p></div>
        <a class="btn btn-outline-primary" th:href="@{/randevu-al}" target="_blank" rel="noopener">Hasta sayfasını aç</a>
    </div>

    <section class="content-card">
        <div class="p-3 border-bottom">
            <form class="row g-2 align-items-end" method="get" th:action="@{/appointment-requests}">
                <div class="col-sm-auto">
                    <label for="status" class="form-label">Durum</label>
                    <select id="status" name="status" class="form-select">
                        <option value="">Tümü</option>
                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status.displayName}"
                                th:selected="${status == selectedStatus}">Durum</option>
                    </select>
                </div>
                <div class="col-sm-auto"><button class="btn btn-outline-primary" type="submit">Filtrele</button></div>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Talep</th><th>Hasta</th><th>Telefon</th><th>Tarih ve saat</th><th>Diş hekimi</th><th>Neden</th><th>Durum</th><th></th></tr></thead>
                <tbody>
                <tr th:each="request : ${requests}">
                    <td><strong th:text="${request.referenceCode}">FD-000001</strong><small class="d-block text-secondary" th:text="${#temporals.format(request.createdAt, 'dd MMM HH:mm')}">Tarih</small></td>
                    <td class="fw-semibold" th:text="${request.fullName}">Hasta</td>
                    <td><a th:href="${'tel:' + request.phone}" th:text="${request.phone}">Telefon</a></td>
                    <td class="text-nowrap"><span th:text="${#temporals.format(request.appointmentDate, 'dd MMM yyyy')}">Tarih</span><small class="d-block text-secondary"><span th:text="${#temporals.format(request.startTime, 'HH:mm')}">09:00</span>–<span th:text="${#temporals.format(request.endTime, 'HH:mm')}">09:30</span></small></td>
                    <td th:text="${request.dentist.fullName}">Diş hekimi</td>
                    <td class="reason-cell" th:text="${request.reason}">Neden</td>
                    <td><span class="badge" th:classappend="${'text-bg-' + request.status.badgeClass}" th:text="${request.status.displayName}">Bekliyor</span></td>
                    <td class="text-end text-nowrap">
                        <div class="d-inline-flex gap-1" th:if="${request.status.name() == 'PENDING'}">
                            <form th:action="@{/appointment-requests/{id}/approve(id=${request.id})}" method="post">
                                <button class="btn btn-sm btn-success" type="submit">Onayla</button>
                            </form>
                            <form th:action="@{/appointment-requests/{id}/reject(id=${request.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Reddet</button>
                            </form>
                        </div>
                        <a th:if="${request.appointment != null}" class="btn btn-sm btn-outline-primary"
                           th:href="@{/patients/{id}(id=${request.appointment.patient.id})}">Randevuyu aç</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}"><td colspan="8" class="empty-state">Bu filtreye uygun randevu talebi bulunamadı.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</html>
