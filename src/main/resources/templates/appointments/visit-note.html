<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Ziyaret notu', ~{::main})}">
<main>
    <div class="page-heading">
        <p class="eyebrow mb-1" th:text="${#temporals.format(appointment.appointmentDate, 'dd MMMM yyyy')}">Ziyaret</p>
        <h1 th:text="${editing ? 'Ziyaret notunu düzenle' : 'Ziyaret notu ekle'}">Ziyaret notu</h1>
        <p class="text-secondary mb-0">
            Hasta: <span th:text="${appointment.patient.fullName}">Hasta</span>
            · Diş hekimi: <span th:text="${appointment.dentist.fullName}">Diş hekimi</span>
        </p>
    </div>
    <section class="content-card form-card">
        <form th:object="${visitNoteForm}" th:action="@{/appointments/{id}/visit-note(id=${appointment.id})}"
              method="post" class="p-4">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            </div>
            <div class="mb-3">
                <label for="proceduresPerformed" class="form-label">Yapılan işlemler *</label>
                <textarea id="proceduresPerformed" class="form-control" rows="4" th:field="*{proceduresPerformed}"
                          th:classappend="${#fields.hasErrors('proceduresPerformed')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:errors="*{proceduresPerformed}"></div>
            </div>
            <div class="mb-3">
                <label for="observations" class="form-label">Tanı / gözlemler</label>
                <textarea id="observations" class="form-control" rows="4" th:field="*{observations}"></textarea>
            </div>
            <div class="mb-3">
                <label for="treatment" class="form-label">Tedavi</label>
                <textarea id="treatment" class="form-control" rows="4" th:field="*{treatment}"></textarea>
            </div>
            <div class="mb-3">
                <label for="recommendations" class="form-label">Öneriler</label>
                <textarea id="recommendations" class="form-control" rows="4" th:field="*{recommendations}"></textarea>
            </div>
            <div class="form-check mb-4">
                <input id="followUpRequired" class="form-check-input" type="checkbox" th:field="*{followUpRequired}">
                <label for="followUpRequired" class="form-check-label">Kontrol randevusu gerekli</label>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Ziyaret notunu kaydet</button>
                <a class="btn btn-outline-secondary" th:href="@{/patients/{id}(id=${appointment.patient.id})}">İptal</a>
            </div>
        </form>
    </section>
</main>
</html>
